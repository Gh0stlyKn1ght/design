name: Verify security handbook and site
on:
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/security-handbook/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y graphviz poppler-utils libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r tools/security-handbook/requirements.txt
      - run: python tools/security-handbook/verify.py
      - run: python tools/security-review/verify.py
      - run: python tools/site/build.py
      - run: python tools/site/verify.py
